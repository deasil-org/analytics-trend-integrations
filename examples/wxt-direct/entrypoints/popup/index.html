<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnalyticsTrend with WXT</title>
    <style>
      body { margin: 0; width: 280px; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #0f1419; background: #ffffff; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #515b69; }
      #consent { margin-bottom: 12px; padding: 12px; border: 1px solid #dde1e8; border-radius: 4px; }
      [hidden] { display: none !important; }
      button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 4px; background: #0d6b58; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid #0d6b58; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1318; color: #e8ecf1; }
        p { color: #98a2ae; }
        button { background: #4fd1a5; color: #0f1318; }
      }
    </style>
  </head>
  <body>
    <h1>AnalyticsTrend with WXT</h1>
    <p>Opening this popup sent one event. The button sends another.</p>
    <div id="consent" hidden>
      <p>Analytics are turned off for this extension.</p>
      <button id="allow" type="button">Turn analytics on</button>
    </div>
    <button id="hello" type="button">Send an event</button>
    <p id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
